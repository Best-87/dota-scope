<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Deep Black / Obsidian Slate Gradient -->
    <radialGradient id="bgDark" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#111624"/>
      <stop offset="50%" stop-color="#090d15"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>

    <!-- Master Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Radiant Verdant Emerald Gradient (Bottom-Left) -->
    <linearGradient id="radiantVerdant" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Radiant Ambient Territory Glow -->
    <radialGradient id="radiantGlow" cx="22%" cy="78%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Dire Fiery Ruby/Crimson Gradient (Top-Right) -->
    <linearGradient id="direCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Dire Ambient Territory Glow -->
    <radialGradient id="direGlow" cx="78%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.40"/>
      <stop offset="50%" stop-color="#b91c1c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing River Flow Gradient -->
    <linearGradient id="riverFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Core Scope Filter Glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. App Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgDark)"/>

  <!-- 2. Dual Gold / Carbon Cyber Frame -->
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
  <rect x="22" y="22" width="468" height="468" rx="94" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="12 8" stroke-opacity="0.6"/>

  <!-- 3. Minimap Battlefield Zone (Rotated Square 380x380) -->
  <g id="battlefield">
    <!-- Radiant & Dire Territory Foundations -->
    <rect x="36" y="36" width="440" height="440" rx="28" fill="#06090e"/>
    <rect x="36" y="36" width="440" height="440" rx="28" fill="url(#radiantGlow)"/>
    <rect x="36" y="36" width="440" height="440" rx="28" fill="url(#direGlow)"/>

    <!-- Map Grid Coordinates Overlay -->
    <line x1="36" y1="146" x2="476" y2="146" stroke="#334155" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6"/>
    <line x1="36" y1="256" x2="476" y2="256" stroke="#334155" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 6"/>
    <line x1="36" y1="366" x2="476" y2="366" stroke="#334155" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6"/>
    <line x1="146" y1="36" x2="146" y2="476" stroke="#334155" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6"/>
    <line x1="256" y1="36" x2="256" y2="476" stroke="#334155" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 6"/>
    <line x1="366" y1="36" x2="366" y2="476" stroke="#334155" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6"/>

    <!-- Terrain Elevation Contour Rings -->
    <!-- Dire Highlands (Top Right) -->
    <path d="M 340 36 C 360 84 400 110 476 120" fill="none" stroke="#ef4444" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 4"/>
    <path d="M 276 36 C 310 118 394 150 476 182" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.22"/>
    <path d="M 216 36 C 265 148 368 200 476 236" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.15" stroke-dasharray="4 4"/>

    <!-- Radiant Forest Cliffs (Bottom Left) -->
    <path d="M 36 340 C 84 360 110 400 120 476" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 4"/>
    <path d="M 36 276 C 118 310 150 394 182 476" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.22"/>
    <path d="M 36 216 C 148 265 200 368 236 476" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.15" stroke-dasharray="4 4"/>

    <!-- 4. THE THREE LANES (Top, Mid, Bottom) -->
    <!-- Top Lane: Radiant (98, 414) -> Corner (98, 98) -> Dire (414, 98) -->
    <path d="M 98 400 L 98 98 L 400 98" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 98 400 L 98 98 L 400 98" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 98 400 L 98 98 L 400 98" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="10 6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Lane: Radiant (98, 414) -> Corner (414, 414) -> Dire (414, 98) -->
    <path d="M 112 414 L 414 414 L 414 112" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 112 414 L 414 414 L 414 112" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 112 414 L 414 414 L 414 112" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="10 6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mid Lane: Direct Diagonal High-Ground Cross -->
    <path d="M 106 406 L 406 106" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
    <path d="M 106 406 L 406 106" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <path d="M 106 406 L 406 106" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-opacity="0.8" stroke-dasharray="12 6" stroke-linecap="round"/>

    <!-- 5. THE DOTA RIVER (Winding Diagonal River Bed) -->
    <path d="M 48 108 C 130 170 190 220 256 256 C 322 292 382 342 464 404" fill="none" stroke="#0284c7" stroke-width="24" stroke-linecap="round" opacity="0.4"/>
    <path d="M 48 108 C 130 170 190 220 256 256 C 322 292 382 342 464 404" fill="none" stroke="url(#riverFlow)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 48 108 C 130 170 190 220 256 256 C 322 292 382 342 464 404" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-dasharray="14 10" stroke-linecap="round" opacity="0.75"/>

    <!-- River Power Runes (Top Rune & Bottom Rune) -->
    <circle cx="194" cy="214" r="10" fill="#0284c7" opacity="0.6"/>
    <circle cx="194" cy="214" r="6" fill="#38bdf8" filter="url(#glowFilter)"/>
    <circle cx="194" cy="214" r="2.5" fill="#ffffff"/>

    <circle cx="318" cy="298" r="10" fill="#0284c7" opacity="0.6"/>
    <circle cx="318" cy="298" r="6" fill="#38bdf8" filter="url(#glowFilter)"/>
    <circle cx="318" cy="298" r="2.5" fill="#ffffff"/>

    <!-- Roshan Pit Icon -->
    <polygon points="156,176 142,200 174,204 170,178" fill="#451a03" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.8"/>
    <circle cx="160" cy="190" r="3.5" fill="#f59e0b"/>

    <!-- Jungle Neutral Camps & Runes (Strategic glowing indicators) -->
    <circle cx="246" cy="376" r="4" fill="#10b981" opacity="0.85"/>
    <circle cx="292" cy="346" r="4" fill="#10b981" opacity="0.85"/>
    <circle cx="176" cy="330" r="4" fill="#10b981" opacity="0.85"/>
    <circle cx="336" cy="182" r="4" fill="#ef4444" opacity="0.85"/>
    <circle cx="276" cy="136" r="4" fill="#ef4444" opacity="0.85"/>
    <circle cx="380" cy="236" r="4" fill="#ef4444" opacity="0.85"/>

    <!-- Defensive Towers (Tier 1 & Tier 2 spots) -->
    <!-- Radiant Towers (Verdant Green gems) -->
    <circle cx="98" cy="300" r="6" fill="#059669" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="98" cy="210" r="6" fill="#059669" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="204" cy="308" r="6" fill="#059669" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="302" cy="414" r="6" fill="#059669" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="212" cy="414" r="6" fill="#059669" stroke="#a7f3d0" stroke-width="1.5"/>

    <!-- Dire Towers (Ruby Crimson gems) -->
    <circle cx="212" cy="98" r="6" fill="#dc2626" stroke="#fecaca" stroke-width="1.5"/>
    <circle cx="302" cy="98" r="6" fill="#dc2626" stroke="#fecaca" stroke-width="1.5"/>
    <circle cx="308" cy="204" r="6" fill="#dc2626" stroke="#fecaca" stroke-width="1.5"/>
    <circle cx="414" cy="210" r="6" fill="#dc2626" stroke="#fecaca" stroke-width="1.5"/>
    <circle cx="414" cy="300" r="6" fill="#dc2626" stroke="#fecaca" stroke-width="1.5"/>

    <!-- 6. ANCIENT FORTRESSES (Radiant Fountain vs Dire Citadel) -->
    <!-- Radiant Ancient Fortress (Bottom-Left: ~98, 414) -->
    <polygon points="98,374 138,414 98,454 58,414" fill="url(#radiantVerdant)" stroke="#a7f3d0" stroke-width="3" filter="url(#glowFilter)"/>
    <circle cx="98" cy="414" r="8" fill="#ffffff"/>

    <!-- Dire Ancient Fortress (Top-Right: ~414, 98) -->
    <polygon points="414,58 454,98 414,138 374,98" fill="url(#direCrimson)" stroke="#fecaca" stroke-width="3" filter="url(#glowFilter)"/>
    <circle cx="414" cy="98" r="8" fill="#ffffff"/>
  </g>

  <!-- 7. CENTER DOTA 2 EMBLEM + SCOPE RETICLE (Hero of the App) -->
  <g id="centerEmblem">
    <!-- Shadow Backdrop for Emblem Distinction -->
    <circle cx="256" cy="256" r="116" fill="#05080e" fill-opacity="0.88" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#glowFilter)"/>

    <!-- Dota 2 Iconic Geometry (River Divide + 2 Ancient Factions) -->
    <!-- The Slanted River Channel -->
    <path d="M 188 324 L 324 188 L 334 198 L 198 334 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Radiant Ancient Shard (Bottom Left Stone) -->
    <path d="M 272 328 C 224 328 178 308 168 248 C 166 230 174 208 186 192 L 204 210 C 196 230 198 258 234 278 C 254 290 274 292 294 288 Z" 
          fill="url(#radiantVerdant)" stroke="#6ee7b7" stroke-width="2" filter="url(#glowFilter)"/>

    <!-- Dire Ancient Shard (Top Right Stone) -->
    <path d="M 240 184 C 288 184 334 204 344 264 C 346 282 338 304 326 320 L 308 302 C 316 282 314 254 278 234 C 258 222 238 220 218 224 Z" 
          fill="url(#direCrimson)" stroke="#f87171" stroke-width="2" filter="url(#glowFilter)"/>

    <!-- Center Precision Tech Scope Reticle -->
    <circle cx="256" cy="256" r="24" fill="#090d15" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="256" cy="256" r="10" fill="#f59e0b" filter="url(#glowFilter)"/>
    <circle cx="256" cy="256" r="3.5" fill="#ffffff"/>

    <!-- Scope Center Crosshair Lines -->
    <line x1="256" y1="196" x2="256" y2="214" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="256" y1="298" x2="256" y2="316" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="196" y1="256" x2="214" y2="256" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="298" y1="256" x2="316" y2="256" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 8. HUD Corner Brackets & Outer Scope Accents -->
  <path d="M 50 82 L 50 50 L 82 50" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 462 82 L 462 50 L 430 50" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 50 430 L 50 462 L 82 462" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 462 430 L 462 462 L 430 462" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

  <line x1="256" y1="8" x2="256" y2="26" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="486" x2="256" y2="504" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="8" y1="256" x2="26" y2="256" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="486" y1="256" x2="504" y2="256" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
</svg>