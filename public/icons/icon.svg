<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Deep Black / Obsidian Gradient -->
    <radialGradient id="darkBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="45%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>

    <!-- Golden Ember Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Crimson Core Glow -->
    <radialGradient id="crimsonGlow" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#b91c1c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Master Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Vivid Red / Dire Blade Gradient -->
    <linearGradient id="direRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Radiant Emerald Shard Gradient -->
    <linearGradient id="radiantGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Carbon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2d3748" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="goldBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Squircle App Base -->
  <rect width="512" height="512" rx="116" fill="url(#darkBg)"/>

  <!-- 2. Dual-Tone Gaming Outer Border -->
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="url(#rimGrad)" stroke-width="3.5"/>

  <!-- 3. Ambient Glows -->
  <circle cx="256" cy="256" r="210" fill="url(#amberGlow)"/>
  <circle cx="256" cy="256" r="140" fill="url(#crimsonGlow)"/>

  <!-- 4. Tactical Radar / Telemetry Grid Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.10"/>
  <circle cx="256" cy="256" r="95" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 6"/>

  <!-- 5. Scope Crosshairs (Golden Pro Ticks) -->
  <line x1="256" y1="44" x2="256" y2="104" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#goldBloom)"/>
  <line x1="256" y1="408" x2="256" y2="468" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#goldBloom)"/>
  <line x1="44" y1="256" x2="104" y2="256" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#goldBloom)"/>
  <line x1="408" y1="256" x2="468" y2="256" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#goldBloom)"/>

  <!-- 6. Corner Precision Brackets (Faceit/Apex/Valorant Tech HUD) -->
  <path d="M 166 136 L 136 136 L 136 166" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 346 136 L 376 136 L 376 166" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 136 346 L 136 376 L 166 376" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 376 346 L 376 376 L 346 376" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- 7. Dota 2 Signature Diagonal River (Cutout) -->
  <path d="M 140 376 L 376 140 L 388 152 L 152 388 Z" fill="#05070a" opacity="0.95"/>

  <!-- 8. Radiant Top-Right Ancient Shard (Sleek Crystal geometry) -->
  <path d="M 235 140 C 295 140 360 165 372 245 C 375 268 362 298 348 318 L 324 294 C 334 268 332 230 284 204 C 258 190 232 188 208 193 Z" 
        fill="url(#radiantGreenGrad)" filter="url(#goldBloom)"/>

  <!-- 9. Dire Bottom-Left Ancient Shard (Aggressive Fiery Blade geometry) -->
  <path d="M 277 372 C 217 372 152 347 140 267 C 137 244 149 214 164 194 L 188 218 C 178 244 180 282 228 308 C 254 322 280 324 304 319 Z" 
        fill="url(#direRedGrad)" filter="url(#goldBloom)"/>

  <!-- 10. Center Eye Precision Core (AI Scope Reticle) -->
  <circle cx="256" cy="256" r="22" fill="#090d14" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#goldBloom)"/>
  <circle cx="256" cy="256" r="9" fill="#f59e0b"/>
  <circle cx="256" cy="256" r="3.5" fill="#ffffff"/>
</svg>
